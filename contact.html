<main>
    <h1>Contact Pagina</h1>
    <p>Heeft u vragen, ideeën, voorstellen of een opmerking? Via onderstaand formulier kunt u ons contacteren en wij zullen zo spoedig mogelijk bij u terug komen.</p>
    <!-- A div to hold the contact form -->
    <div class="contact-form">
        <form>
            <h2>Neem contact op met ons</h2>
            <label for="naam">Naam</label>
            <input type="text" id="naam" name="naam" required>
            <label for="email">E-mailadres</label>
            <input type="email" id="email" name="email" required>
            <label for="onderwerp">Onderwerp</label>
            <input type="text" id="onderwerp" name="onderwerp">
            <label for="bericht">Bericht</label>
            <textarea id="bericht" name="bericht" required></textarea>
            <!--A button to submit the form-->
            <button type="submit">Versturen</button>
        </form>
    </div>
    <script src="script.js"></script>
</main>
